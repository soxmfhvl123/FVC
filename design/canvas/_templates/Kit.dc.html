<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FVC — Graphic kit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<!--HEAD-->
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 2000px; height: 1820px; box-sizing: border-box; background: #E8E7E3; color: #0B0B0B; font-family: 'Inter Tight', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<!--DEFS-->
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
<defs>

<clipPath id="k-lens"><circle cx="250" cy="300" r="190"></circle></clipPath>
<clipPath id="k-ov1"><ellipse cx="0" cy="0" rx="110" ry="58"></ellipse></clipPath>
<clipPath id="k-ov2"><ellipse cx="0" cy="0" rx="80" ry="30"></ellipse></clipPath>
<clipPath id="k-ov3"><ellipse cx="0" cy="0" rx="70" ry="26"></ellipse></clipPath>
<path id="k-ring" d="M0 0 m-62 0 a62 62 0 1 1 124 0 a62 62 0 1 1 -124 0"></path>
<path id="k-ring2" d="M250 300 m-150 0 a150 150 0 1 1 300 0 a150 150 0 1 1 -300 0"></path>
</defs>
</svg>

  <div style="height: 58px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #0B0B0B">
    <h1 style="margin: 0; font-size: 32px; font-weight: 500; letter-spacing: -0.03em">03 Graphic kit <span style="font-family: 'Grenze Gotisch', serif; font-weight: 800; letter-spacing: 0">twelve</span> <span style="font-family: 'Instrument Serif', serif; font-style: italic">strains</span></h1>
    <span style="font-size: 14px">Label · Meter · Lens · Pattern · Mutation · Mitosis · Stickers · Rx · Map · Tape · Ticket · Pressing</span>
  </div>

  <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr))">

    <!-- 01 SPECIMEN LABEL -->
    <div style="border-right: 2px solid #0B0B0B; border-bottom: 2px solid #0B0B0B; overflow: hidden">

        <rect x="30" y="60" width="440" height="20" fill="#0B0B0B"></rect>
        <text x="250" y="75" text-anchor="middle" font-family="Inter Tight, sans-serif" font-weight="800" font-size="12" letter-spacing="9" fill="#F7F7F5">SPECIMEN LABEL ▮ FVC</text>
        <text x="26" y="196" font-family="Archivo, sans-serif" font-weight="900" font-stretch="125%" font-size="132" letter-spacing="-8" fill="#0B0B0B">007</text>
        <svg x="292" y="190" width="190" height="190" viewBox="0 0 300 300"><path d="{{lab.ink}}" fill="#0B0B0B"></path></svg>
        <g font-family="Inter Tight, sans-serif" font-size="13" fill="#0B0B0B"><text x="30" y="236">STRAIN TYPE</text><text x="150" y="236" font-weight="600">[GENRE]</text><text x="30" y="266">CARRIER</text><text x="150" y="266" font-weight="600">[ARTIST]</text><text x="30" y="296">INCUBATION</text><text x="150" y="296" font-weight="600">[0:00]</text><text x="30" y="326">SPREAD</text><text x="150" y="326" font-weight="600">■■■■□</text><text x="30" y="356">ISOLATED</text><text x="150" y="356" font-weight="600">[DATE] SEOUL</text></g>
        <g stroke="#0B0B0B" stroke-width="1.5"><line x1="30" y1="244" x2="280" y2="244"></line><line x1="30" y1="274" x2="280" y2="274"></line><line x1="30" y1="304" x2="280" y2="304"></line><line x1="30" y1="334" x2="280" y2="334"></line><line x1="30" y1="364" x2="280" y2="364"></line></g>
        <rect x="30" y="400" width="250" height="34" fill="{{accent}}"></rect>
        <text x="40" y="423" font-family="Archivo, sans-serif" font-weight="900" font-stretch="100%" font-size="20" fill="#0B0B0B">CERTIFIED CARRIER</text>
        <path d="{{bc1}}" transform="translate(30 456)" fill="#0B0B0B"></path>
        <text x="30" y="530" font-family="DM Mono, monospace" font-size="11" fill="#0B0B0B">FVC007-SEOUL-0001</text>
        <path d="M440 470 V530 M410 500 H470" stroke="#0B0B0B" stroke-width="1.5"></path><circle cx="440" cy="500" r="12" fill="none" stroke="#0B0B0B" stroke-width="1.5"></circle>
        <rect width="500" height="585" filter="url(#fvc-grain)" opacity="0.18" style="mix-blend-mode: multiply"></rect>
        <rect width="168" height="26" fill="#0B0B0B"></rect><text x="10" y="18" font-family="Inter Tight, sans-serif" font-weight="600" font-size="12" fill="#F7F7F5">01 Specimen label</text>
      </svg>
    </div>

    <!-- 02 VU -->
    <div style="border-right: 2px solid #0B0B0B; border-bottom: 2px solid #0B0B0B; overflow: hidden">
      <svg viewBox="0 0 500 585" preserveAspectRatio="xMidYMid slice" role="img" aria-label="One-bit spread meter peaking at level 4" style="display: block; width: 100%; height: 100%">
        <rect width="500" height="585" fill="#0B0B0B"></rect>
        <text x="30" y="80" font-family="Inter Tight, sans-serif" font-weight="500" font-size="34" letter-spacing="-1" fill="#E8E7E3">Spread meter</text>
        <text x="30" y="120" font-family="Grenze Gotisch, serif" font-weight="800" font-size="34" fill="#E8E7E3">stuck in your head</text>
        <path d="{{vu.off}}" fill="#262626"></path>
        <path d="{{vu.on}}" fill="#E8E7E3"></path>
        <path d="{{vu.hot}}" fill="{{accent}}"></path>
        <line x1="30" y1="512" x2="470" y2="512" stroke="#E8E7E3" stroke-width="1.5"></line>
        <g font-family="DM Mono, monospace" font-size="11" fill="#E8E7E3"><text x="40" y="534">-20</text><text x="160" y="534">-10</text><text x="290" y="534">0</text><text x="396" y="534">+3 FAT</text></g>
        <rect width="150" height="26" fill="#E8E7E3"></rect><text x="10" y="18" font-family="Inter Tight, sans-serif" font-weight="600" font-size="12" fill="#0B0B0B">02 Spread meter</text>
      </svg>
    </div>

    <!-- 03 LENS -->
    <div style="border-right: 2px solid #0B0B0B; border-bottom: 2px solid #0B0B0B; overflow: hidden">
      <svg viewBox="0 0 500 585" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Microscope lens full of bitmap germs" style="display: block; width: 100%; height: 100%">
        <rect width="500" height="585" fill="#D4D3CF"></rect>
        <circle cx="250" cy="300" r="190" fill="#F2F1ED"></circle>
        <g clip-path="url(#k-lens)">
          <svg x="70" y="110" width="200" height="200" viewBox="0 0 300 300"><path d="{{l1.spot}}" fill="{{accent}}"></path><path d="{{l1.ink}}" fill="#0B0B0B"></path></svg>
          <svg x="250" y="120" width="150" height="150" viewBox="0 0 300 300"><path d="{{l2.ink}}" fill="#0B0B0B"></path></svg>
          <svg x="160" y="270" width="220" height="220" viewBox="0 0 300 300"><path d="{{l3.spot}}" fill="#A6FF00"></path><path d="{{l3.ink}}" fill="#0B0B0B"></path></svg>
          <svg x="60" y="320" width="130" height="130" viewBox="0 0 300 300"><path d="{{l4.spot}}" fill="#FF2DB4"></path><path d="{{l4.ink}}" fill="#0B0B0B"></path></svg>
          <svg x="340" y="290" width="100" height="100" viewBox="0 0 300 300"><path d="{{l2.ink}}" fill="#0B0B0B"></path></svg>
          <path d="M250 110 V490 M60 300 H440" stroke="#0B0B0B" stroke-width="1" opacity="0.6"></path>
        </g>
        <circle cx="250" cy="300" r="190" fill="none" stroke="#0B0B0B" stroke-width="16"></circle>
        <circle cx="250" cy="300" r="214" fill="none" stroke="#0B0B0B" stroke-width="1.5"></circle>
        <text x="24" y="62" font-family="Inter Tight, sans-serif" font-weight="500" font-size="26" letter-spacing="-0.5" fill="#0B0B0B">×400</text>
        <text x="476" y="62" text-anchor="end" font-family="Inter Tight, sans-serif" font-weight="500" font-size="26" fill="#0B0B0B">Colony 05</text>
        <line x1="24" y1="556" x2="124" y2="556" stroke="#0B0B0B" stroke-width="4"></line>
        <text x="134" y="561" font-family="DM Mono, monospace" font-size="12" fill="#0B0B0B">= 100 BPM</text>
        <rect width="500" height="585" filter="url(#fvc-grain)" opacity="0.2" style="mix-blend-mode: multiply"></rect>
        <rect width="126" height="26" fill="#0B0B0B"></rect><text x="10" y="18" font-family="Inter Tight, sans-serif" font-weight="600" font-size="12" fill="#F7F7F5">03 Lens view</text>
      </svg>
    </div>

    <!-- 04 PATTERN -->
    <div style="border-bottom: 2px solid #0B0B0B; overflow: hidden">
      <svg viewBox="0 0 500 585" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Repeat pattern of bitmap germs on acid green" style="display: block; width: 100%; height: 100%">

        <text x="36" y="544" font-family="Inter Tight, sans-serif" font-weight="800" font-size="13" letter-spacing="3" fill="#A6FF00">COLONY REPEAT ▮ TOTE / SLEEVE</text>
        <rect width="104" height="26" fill="#0B0B0B"></rect><text x="10" y="18" font-family="Inter Tight, sans-serif" font-weight="600" font-size="12" fill="#F7F7F5">04 Pattern</text>
      </svg>
    </div>

    <!-- 05 MUTATION INDEX (HTML grid) -->
    <div style="position: relative; border-right: 2px solid #0B0B0B; border-bottom: 2px solid #0B0B0B; overflow: hidden; background: #F7F7F5; display: flex; flex-direction: column">
      <div style="height: 26px; display: flex"><span style="background: #0B0B0B; color: #F7F7F5; font-weight: 600; font-size: 12px; padding: 5px 10px">05 Mutation index</span></div>
      <div style="padding: 10px 18px 4px; display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 30px; font-weight: 500; letter-spacing: -0.03em">One mark,</span><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 32px">seven strains</span></div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); border-top: 2px solid #0B0B0B">
        <sc-for list="{{mut}}" as="m" hint-placeholder-count="9">
          <div style="position: relative; border-right: 1px solid #0B0B0B; border-bottom: 1px solid #0B0B0B; display: flex; align-items: center; justify-content: center">
            <svg viewBox="0 0 200 260" aria-hidden="true" style="display: block; width: 92px; height: 120px"><path d="{{m.d}}" fill="#0B0B0B" fill-rule="evenodd"></path><text x="100" y="244" text-anchor="middle" font-family="{{m.font}}" font-style="{{m.fstyle}}" font-weight="{{m.weight}}" font-stretch="{{m.stretch}}" font-size="{{m.size}}" fill="{{m.tfill}}">{{m.ch}}</text></svg>
            <span style="position: absolute; left: 6px; bottom: 4px; font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase">{{m.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- 06 MITOSIS -->
    <div style="border-right: 2px solid #0B0B0B; border-bottom: 2px solid #0B0B0B; overflow: hidden">
      <svg viewBox="0 0 500 585" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mitosis in four frames: one bitmap germ stretches and splits in two" style="display: block; width: 100%; height: 100%">
        <rect width="500" height="585" fill="#E8E7E3"></rect>
        <text x="24" y="66" font-family="Inter Tight, sans-serif" font-weight="500" font-size="30" letter-spacing="-1" fill="#0B0B0B">How a hit <tspan font-family="Grenze Gotisch, serif" font-weight="800">splits</tspan></text>
        <g fill="none" stroke="#0B0B0B" stroke-width="1.5"><rect x="20" y="90" width="230" height="220"></rect><rect x="250" y="90" width="230" height="220"></rect><rect x="20" y="310" width="230" height="220"></rect><rect x="250" y="310" width="230" height="220"></rect></g>

        <svg x="256" y="350" width="112" height="112" viewBox="0 0 300 300"><path d="{{mi.spot}}" fill="{{accent}}"></path><path d="{{mi.ink}}" fill="#0B0B0B"></path></svg>
        <svg x="360" y="396" width="112" height="112" viewBox="0 0 300 300"><path d="{{mi2.spot}}" fill="{{accent}}"></path><path d="{{mi2.ink}}" fill="#0B0B0B"></path></svg>
        <text x="24" y="562" font-family="Inter Tight, sans-serif" font-size="13" fill="#0B0B0B">1 PLAY → 2 CARRIERS → 4 → 8 → …</text>
        <rect width="500" height="585" filter="url(#fvc-grain)" opacity="0.18" style="mix-blend-mode: multiply"></rect>
        <rect width="104" height="26" fill="#0B0B0B"></rect><text x="10" y="18" font-family="Inter Tight, sans-serif" font-weight="600" font-size="12" fill="#F7F7F5">06 Mitosis</text>
      </svg>
    </div>

    <!-- 07 STICKERS -->
    <div style="border-right: 2px solid #0B0B0B; border-bottom: 2px solid #0B0B0B; overflow: hidden">
      <svg viewBox="0 0 500 585" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sticker sheet: grain oval, contagious seal, glitch label" style="display: block; width: 100%; height: 100%">
        <rect width="500" height="585" fill="#FF2DB4"></rect>
        <g transform="translate(170 150) rotate(-8)"><ellipse rx="118" ry="66" fill="#F7F7F5"></ellipse><g clip-path="url(#k-ov1)"><rect x="-110" y="-58" width="220" height="116" filter="url(#fvc-bitnoise)"></rect></g><ellipse rx="110" ry="58" fill="none" stroke="#0B0B0B" stroke-width="3"></ellipse><rect x="-78" y="-22" width="156" height="44" fill="#0B0B0B"></rect><text y="15" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="900" font-stretch="125%" font-size="38" fill="#F7F7F5">FVC</text></g>
        <g transform="translate(370 190) rotate(12)"><circle r="96" fill="#F7F7F5"></circle><circle r="88" fill="#0B0B0B"></circle><text font-family="Inter Tight, sans-serif" font-weight="800" font-size="13" letter-spacing="3" fill="#F7F7F5"><textPath href="#k-ring">HIGHLY CONTAGIOUS ▮ NO KNOWN CURE ▮</textPath></text><svg x="-50" y="-50" width="100" height="100" viewBox="0 0 300 300"><path d="{{st.ink}}" fill="#F7F7F5"></path></svg></g>
        <g transform="translate(250 380) rotate(-4)"><rect x="-212" y="-58" width="424" height="116" fill="#F7F7F5"></rect><rect x="-204" y="-50" width="408" height="100" fill="#0B0B0B"></rect><text x="-190" y="18" font-family="Grenze Gotisch, serif" font-weight="900" font-size="64" fill="#A6FF00">Fat</text><text x="-84" y="22" font-family="Archivo, sans-serif" font-weight="900" font-stretch="62%" font-size="72" fill="none" stroke="#A6FF00" stroke-width="2">SOUND</text><text x="76" y="18" font-family="Instrument Serif, serif" font-style="italic" font-size="64" fill="#A6FF00">inside</text></g>
        <g transform="translate(120 500) rotate(6)"><rect x="-92" y="-30" width="184" height="60" rx="30" fill="#F7F7F5"></rect><rect x="-86" y="-24" width="172" height="48" rx="24" fill="{{accent}}" stroke="#0B0B0B" stroke-width="3"></rect><text y="8" text-anchor="middle" font-family="Inter Tight, sans-serif" font-weight="800" font-size="20" fill="#0B0B0B">CATCH IT ↗</text></g>
        <g transform="translate(360 500) rotate(-10)"><rect x="-70" y="-34" width="140" height="68" fill="#F7F7F5"></rect><path d="{{bc2}}" transform="translate(-60 -24)" fill="#0B0B0B"></path><text x="0" y="28" text-anchor="middle" font-family="DM Mono, monospace" font-size="10" fill="#0B0B0B">FVC-007 ▮ 0001</text></g>
        <rect width="114" height="26" fill="#0B0B0B"></rect><text x="10" y="18" font-family="Inter Tight, sans-serif" font-weight="600" font-size="12" fill="#F7F7F5">07 Stickers</text>
      </svg>
    </div>

    <!-- 08 RX -->

          <text x="80" y="160" font-family="Grenze Gotisch, serif" font-weight="900" font-size="130" fill="#0B0B0B">Rx</text>

          <path d="M86 476 C106 444 124 496 144 466 S184 436 196 474 S234 496 256 460" fill="none" stroke="#0B0B0B" stroke-width="3" stroke-linecap="round"></path>

        </g>
        <rect width="500" height="585" filter="url(#fvc-grain)" opacity="0.22" style="mix-blend-mode: multiply"></rect>
        <rect width="90" height="26" fill="#0B0B0B"></rect><text x="10" y="18" font-family="Inter Tight, sans-serif" font-weight="600" font-size="12" fill="#F7F7F5">08 Rx slip</text>
      </svg>
    </div>

    <!-- 09 SPREAD MAP -->
    <div style="border-right: 2px solid #0B0B0B; overflow: hidden">
      <svg viewBox="0 0 500 585" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrative spread map radiating out from Seoul" style="display: block; width: 100%; height: 100%">
        <rect width="500" height="585" fill="#0B0B0B"></rect>
        <text x="24" y="70" font-family="Inter Tight, sans-serif" font-weight="500" font-size="30" letter-spacing="-1" fill="#E8E7E3">Spread map</text>
        <text x="476" y="70" text-anchor="end" font-family="Instrument Serif, serif" font-style="italic" font-size="24" fill="#E8E7E3">illustrative</text>
