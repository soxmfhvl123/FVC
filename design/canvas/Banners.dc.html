<text x="20" y="24">Seethe-thump, seethe-thump. The colony wakes under a sodium light.</text><text x="20" y="38">Somebody presses play and nobody presses stop.</text><text x="20" y="52">In the queue, in the cab, in the shower: the carrier hums,</text><text x="20" y="66">and the hum carries. A fat germ has no legs, but it travels.</text>
<text x="490" y="24">The low end leaks through the wall. Next door starts nodding.</text><text x="490" y="38">By the second chorus the whole floor has caught it.</text><text x="490" y="52">Symptoms: humming, tapping, sudden playlist edits.</text><text x="490" y="66">Known cure: none. Recommended dose: one more listen.</text>
<text x="960" y="24">Incubation is about three minutes and forty seconds.</text><text x="960" y="38">After that it lives in you, rent free, on repeat.</text><text x="960" y="52">Pass it on. Every carrier makes two more.</text><text x="960" y="66">flicker-light, pixel-flake, fat-sound, spread.</text>

      this._bg = { m1: this.germBits(41, { N: 60, two: false, dust: 0, eyes: 'cyclops' }), m2: this.germBits(131, { N: 60, two: false, dust: 0 }), t1: this.germBits(23, { N: 90, dust: 0.002 }) };
    }
    var seed = st.seed || 7, tick = st.tick || 0, live = st.live !== false;
    return { BN: this.banners(seed, tick), bG: this._bg, seed: seed, shuffle: this._h.shuffle, toggle: this._h.toggle, liveBtn: live ? 'Freeze' : 'Go live', livePressed: live ? 'true' : 'false' };
  }
}
</script>
